<svg width="1600" height="659" viewBox="0 0 1600 659" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="darkTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="aiTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="659" fill="#f5f5f5"/>

  <!-- Icon badge -->
  <g transform="translate(260,330)">
    <!-- outer ring with swoosh gap effect -->
    <circle r="165" fill="none" stroke="url(#ringGrad)" stroke-width="18"/>
    <!-- swoosh accent overlapping top-right of ring -->
    <path d="M 60,-150 A 165,165 0 0,1 150,-30" fill="none" stroke="#f5f5f5" stroke-width="26" stroke-linecap="round"/>
    <path d="M 70,-145 A 158,158 0 0,1 145,-45" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

    <!-- inner white circle -->
    <circle r="140" fill="#ffffff"/>
    <circle r="110" fill="url(#glowGrad)"/>

    <!-- connector lines -->
    <g stroke="url(#iconGrad)" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-95"/>
      <line x1="0" y1="0" x2="0" y2="95"/>
      <line x1="0" y1="0" x2="-95" y2="0"/>
      <line x1="0" y1="0" x2="95" y2="0"/>
    </g>

    <!-- outer node dots -->
    <g fill="url(#iconGrad)">
      <circle cx="0" cy="-95" r="20"/>
      <circle cx="0" cy="95" r="20"/>
      <circle cx="-95" cy="0" r="20"/>
      <circle cx="95" cy="0" r="20"/>
    </g>

    <!-- center circle with plus -->
    <circle r="52" fill="url(#iconGrad)"/>
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="470" y="405" font-size="185" letter-spacing="2" fill="url(#darkTextGrad)">MEDILINK</text>
    <text x="1330" y="405" font-size="185" letter-spacing="2" fill="url(#aiTextGrad)">AI</text>
    <!-- swoosh accent under K / before AI -->
    <path d="M 1290,330 C 1350,360 1400,345 1440,315" fill="none" stroke="url(#aiTextGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
